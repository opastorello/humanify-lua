[package]
name = "humanify-lua"
version = "4.0.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2.0.18"
full_moon = { version = "2.2", default-features = false, features = ["lua54", "luajit", "cfxlua", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
